# i3status configuration file

general {
    output_format = "i3bar"
    colors = true
    interval = 5
}

order += "ethernet tun0"
order += "ipv6"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "disk /"
order += "cpu_usage"
order += "memory"
order += "tztime local"

ipv6 {
    format_up = "%ip"
    format_down = ""
}

ethernet tun0 {
        format_up = "VPN %ip"
        format_down = ""
}

wireless _first_ {
    format_up = "🌐 [%quality] WIFI: %ip "
    format_down = ""
}

ethernet _first_ {
    format_up = "%ip (%speed)"
    format_down = ""
}

battery all {
    format = "%status ⚡ %percentage [%remaining]"
}

disk "/" {
    format = "💽 %avail"
}

cpu_usage {
    format = "⚙️ %usage"
		max_threshold = 85
}

memory {
    format = "🧠 %used / %available"
    threshold_degraded = "1G"
    format_degraded = "🧠 MEM < %available"
}

tztime local {
    format = "⏰ %Y-%m-%d %H:%M:%S"
}

