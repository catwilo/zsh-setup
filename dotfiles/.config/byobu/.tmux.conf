# .tmux.conf -- byobu (tmux backend) overrides.
#
# Loaded by byobu after its own profile, so anything set here wins.
# Kept minimal on purpose: every option has a visible effect on the bar
# or on the pane border, nothing else is tuned.

# Pane label on the top border of each pane. Two fields, both cheap:
#
#   #{pane_current_command}   the process running in the pane (zsh, nvim,
#                             miko, gao...). Tells you at a glance what
#                             each split is doing.
#   #{pane_current_path}      the working directory of that pane, with
#                             $HOME shortened to ~ so it stays short.
#
# Active pane is highlighted (colour214, amber); inactive panes are dim
# (colour244, grey). No other per-pane work runs; both fields are read
# from tmux itself, not from a shell.
set-option -g pane-border-status top
set-option -g pane-border-format " #{?pane_active,#[fg=colour214],#[fg=colour244]}#{pane_index}:#{pane_current_command} #[default]#[fg=colour240]· #{s/\/data\/data\/com.termux\/files\/home/~:pane_current_path} #[default]"

# Numbering standard, part 1 of 2: indexes.
#
#   base-index 1        windows are numbered 1, 2, 3, ...
#   pane-base-index 1   panes inside each window are numbered 1, 2, 3, ...
#
# Both default to 0 in tmux; starting at 1 is the convention used by
# every professional tmux setup and avoids the mental mismatch between
# "Ctrl-a 0" and "the first window".
set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Numbering standard, part 2 of 2: labels.
#
# The window bar shows `wN` where N is the window index (see base-index
# above). The window's own name is irrelevant for that view: the label
# is derived from the index, so it always matches the shortcut you would
# press (Ctrl-a 1 -> the window labeled w1). The command running in the
# active pane does not rename the window either, so labels stay stable
# while you move between panes and programs.
set-option -g automatic-rename off
set-option -g allow-rename off
set-window-option -g window-status-format "#[fg=colour244] w#{window_index} #[default]"
set-window-option -g window-status-current-format "#[fg=colour214,bold] w#{window_index} #[default]"
set-window-option -g window-status-separator ""

# No bell noise. Window activity is still marked in the window list
# through byobu's own style, no need to flash or beep.
set-option -g bell-action none
set-option -g visual-bell off

# tmux normally paints a short message on the status bar for every
# command. Those messages cover the modules configured in `status`;
# suppress them so the bar only shows the modules, never transient text.
set-option -g display-time 0
